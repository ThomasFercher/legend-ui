name: CI

on:
  push:
    branches: [rewrite]
  pull_request:
    branches: [rewrite]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.6
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: |
          for pkg in packages/*; do
            if compgen -G "$pkg/test/**/*_test.dart" > /dev/null || compgen -G "$pkg/test/*_test.dart" > /dev/null; then
              echo "Testing $pkg"
              (cd "$pkg" && flutter test)
            fi
          done

      - name: Generated output is fresh
        working-directory: packages/nomo_ui_kit
        run: dart run nomo_gen themes lib test/consumer --check
