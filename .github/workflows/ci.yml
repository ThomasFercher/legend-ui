name: CI

on:
  push:
    branches: [rewrite]
  pull_request:
    branches: [rewrite]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.6
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Generated output is fresh
        working-directory: packages/legend_ui
        run: |
          dart run legend_gen themes lib test/consumer --check
          dart run legend_gen docs lib test/consumer --check
          dart run legend_gen tokens lib --check

      - name: Example builds for web
        working-directory: example
        run: flutter build web
