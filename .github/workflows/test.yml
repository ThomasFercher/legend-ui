name: Tests

on:
  push:
    branches: [rewrite]
  pull_request:
    branches: [rewrite]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.6
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Test all packages
        run: |
          for pkg in packages/* example; do
            if compgen -G "$pkg/test/**/*_test.dart" > /dev/null || compgen -G "$pkg/test/*_test.dart" > /dev/null; then
              echo "Testing $pkg"
              (cd "$pkg" && flutter test)
            fi
          done
