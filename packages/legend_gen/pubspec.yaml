name: legend_gen
description: Standalone CLI for Legend UI Kit — generates component theme plumbing from @LegendThemeable decorators; also icon tables, scaffolding, and setup diagnostics.
version: 0.1.0-dev.0
repository: https://github.com/legend-app/legend-ui-kit
publish_to: none # published to pub.dev once Phase 0 validates the annotation contract
resolution: workspace

environment:
  sdk: ^3.10.0

executables:
  legend_gen:

dependencies:
  analyzer: ^8.0.0
  args: ^2.6.0
  dart_style: ^3.0.0
  path: ^1.9.0

dev_dependencies:
  test: ^1.25.0
  very_good_analysis: ^7.0.0
