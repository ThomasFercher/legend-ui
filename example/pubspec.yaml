name: example
description: Legend UI Kit gallery — living documentation of every component.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  legend_ui: any # resolved from the workspace
  # Only for the custom-syntax docs demo (a md.InlineSyntax subclass) —
  # already in the workspace as legend_ui's markdown engine.
  markdown: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^7.0.0

flutter:
  # Only for the Icons glyph font — the kit itself is icon-agnostic and
  # the gallery never uses Material widgets.
  uses-material-design: true
